  <style>
    :root {
      --rojo: #b21f24;
      --negro: #111111;
      --gris: #f2f2f2;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--gris);
      color: var(--negro);
      line-height: 1.5;
    }

    header {
      background: var(--gris);
      text-align: center;
      padding-bottom: 2rem;
    }

    .hero-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }

    .hero-text {
      margin-top: 2rem;
      padding: 0 1rem;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 0.8rem;
    }

    .hero-text h1 span {
      color: var(--rojo);
    }

    .hero-text p {
      font-size: 1.2rem;
      max-width: 760px;
      margin: 0 auto;
    }

    main {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .info {
      background: var(--blanco);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: grid;
      gap: 1.5rem;
    }

    .info-item {
      border-left: 6px solid var(--rojo);
      padding-left: 1rem;
    }

    .info-item h3 {
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .destacado {
      margin-top: 2.5rem;
      text-align: center;
      padding: 2rem;
      background: var(--negro);
      color: var(--blanco);
      border-radius: 12px;
    }

    .destacado h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .destacado span {
      color: var(--rojo);
      font-weight: bold;
    }

    footer {
      margin-top: 4rem;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #555;
    }

    @media (max-width: 600px) {
      .hero-text h1 {
        font-size: 2rem;
      }

      .hero-text p {
        font-size: 1.05rem;
      }
    }

    .carousel-inner>.item>img,
    .carousel-inner>.item>a>img {
      width: 60%;
      margin: auto;
    }
  </style>
</head>
